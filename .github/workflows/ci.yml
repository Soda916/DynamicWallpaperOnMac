name: Build & Test (Universal Binary)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test on macOS Sonoma (Universal Binary)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true

      - name: Verify Swift Toolchain
        run: swift --version

      - name: Build Package (Universal Binary arm64 + x86_64)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Run Swift Tests
        run: swift test
