name: Build & Test (Universal Binary)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test on macOS Sonoma
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Swift Toolchain
        run: swift --version

      - name: Build Package (Release)
        run: swift build -c release

      - name: Run DynamicWallpaper Engine Test Suite
        run: swift run DynamicWallpaperTests
